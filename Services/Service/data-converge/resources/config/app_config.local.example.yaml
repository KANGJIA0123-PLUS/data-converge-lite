# 仅用于本地或隔离环境；该配置不创建数据库/表。
logging:
  debug_enabled: false  # true仅打印失败SQL与详细错误，成功SQL不打印；修改后需重启，必须使用布尔值。
  max_bytes: 20971520
  backup_count: 10
  retention_days: 7

clickhouse:
  host: 127.0.0.1
  port: 8123
  database: modelmate_metric
  username: default
  password_env: CLICKHOUSE_PASSWORD
  secure: false
  verify: true
dwd_ready:
  enabled: false  # 仅本地原流程调试；生产配置默认开启，不可绕过既有账本门控。

startup:
  timeout_seconds: 600
  initial_retry_delay_seconds: 2
  max_retry_delay_seconds: 30
  probe_timeout_seconds: 10

state:
  directory: ./var/lite-state
scheduler:
  # 调度时区跟随当前进程的 TZ 或系统时区配置。
  task_timeout_seconds: {5min: 120, hour: 600, day: 1800, month: 1800}
  max_concurrent_tasks: 4
  task_parallelism: 1
  poll_interval_seconds: 5
  catchup_limit: 100
  max_attempts: 3
  retry_delay_seconds: 30
config:
  convergence_rules_path: resources/config/convergence_rules.yaml
  sql_directory: resources/sql
