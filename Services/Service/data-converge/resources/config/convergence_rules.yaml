  # 6.1.3 模型指标实例天ADS
  - taskname: task_model_metric_instance_day_ads
    description: 模型指标实例天ADS表
    source_tables:
      - t_mops__modelmetric_instance__day_dws
      - t_mops_modelinstance_day_ads
    target_table: t_mops__modelmetric_instance__day_ads
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_model_metric_instance_day_dws
      - task_model_instance_day_ads
    sql_id: task_model_metric_instance_day_ads

  # 6.1.4 模型指标实例月ADS
  - taskname: task_model_metric_instance_month_ads
    description: 模型指标实例月ADS表
    source_tables:
      - t_mops__modelmetric_instance__month_dws
      - t_mops_modelinstance_month_ads
    target_table: t_mops__modelmetric_instance__month_ads
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_model_metric_instance_month_dws
      - task_model_instance_month_ads
    sql_id: task_model_metric_instance_month_ads

  # ============================================================================
  # 6.2 模型指标服务器ADS表 (Instance ADS -> Server ADS)
  # ============================================================================

  # 6.2.1 模型指标服务器5分钟ADS
  - taskname: task_model_metric_server_5min_ads
    description: 模型指标服务器5分钟ADS表
    source_tables:
      - t_mops__modelmetric_instance__5min_ads
    target_table: t_mops__modelmetric_server__5min_ads
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    depends_on:
      - task_model_metric_instance_5min_ads
    sql_id: task_model_metric_server_5min_ads

  # 6.2.2 模型指标服务器小时ADS
  - taskname: task_model_metric_server_hour_ads
    description: 模型指标服务器小时ADS表
    source_tables:
      - t_mops__modelmetric_instance__hour_ads
    target_table: t_mops__modelmetric_server__hour_ads
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
      - task_model_metric_instance_hour_ads
    sql_id: task_model_metric_server_hour_ads

  # 6.2.3 模型指标服务器天ADS
  - taskname: task_model_metric_server_day_ads
    description: 模型指标服务器天ADS表
    source_tables:
      - t_mops__modelmetric_instance__day_ads
    target_table: t_mops__modelmetric_server__day_ads
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_model_metric_instance_day_ads
    sql_id: task_model_metric_server_day_ads

  # 6.2.4 模型指标服务器月ADS
  - taskname: task_model_metric_server_month_ads
    description: 模型指标服务器月ADS表
    source_tables:
      - t_mops__modelmetric_instance__month_ads
    target_table: t_mops__modelmetric_server__month_ads
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_model_metric_instance_month_ads
    sql_id: task_model_metric_server_month_ads

  # ============================================================================
