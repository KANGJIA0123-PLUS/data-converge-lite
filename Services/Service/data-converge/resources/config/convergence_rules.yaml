# DataConverge 汇聚任务配置
#
# 配置说明:
#   - taskname: 任务唯一标识（必填）
#   - description: 任务描述（可选）
#   - source_tables: 源表列表（必填，至少一个）
#   - target_table: 目标表（必填）
#   - aggregation_interval: 聚合时间窗口(ISO 8601 Duration)（必填）
#   - cron: 任务触发时间(标准cron表达式)（必填）
#   - depends_on: 依赖的任务taskname列表（可选，默认空列表）
#   - sql_id: 对应config/sql/目录下SQL文件的ID（必填）
#
# 时间规则说明:
#   - 5分钟任务: 在第6分钟执行(6,11,16,21,26,31,36,41,46,51,56)，等待上游DWD数据就绪
#   - 小时任务: 在每小时第6分钟执行，等待5分钟任务完成
#   - 天任务: 在每天00:10执行，等待小时任务完成
#   - 月任务: 在每月1号00:20执行，等待天任务完成

convergence_rules:
  # ============================================================================
  # 1. GPU 聚合链 (DWD -> DWS -> DWS -> DWS -> DWS)
  # ============================================================================

  # 1.1 GPU 5分钟实时汇聚: DWD -> DWS
  # 执行时间: 6,11,16,21,26,31,36,41,46,51,56分
  - taskname: task_gpu_realtime_to_5min_dws
    description: GPU实时数据 -> 5分钟预聚合 (DWD -> DWS)
    source_tables:
      - t_mops_gpu_realtime_dwd
    target_table: t_mops_gpu_5min_dws
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    depends_on: []
    sql_id: task_gpu_realtime_to_5min_dws

  # 1.2 GPU 小时汇聚: DWS -> DWS
  # 执行时间: 每小时第6分钟
  - taskname: task_gpu_5min_to_hour_dws
    description: GPU 5分钟数据 -> 小时聚合 (DWS -> DWS)
    source_tables:
      - t_mops_gpu_5min_dws
    target_table: t_mops_gpu_hour_dws
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
      - task_gpu_realtime_to_5min_dws
    sql_id: task_gpu_5min_to_hour_dws

  # 1.3 GPU 天汇聚: DWS -> DWS
  # 执行时间: 每天00:10
  - taskname: task_gpu_hour_to_day_dws
    description: GPU小时数据 -> 天聚合 (DWS -> DWS)
    source_tables:
      - t_mops_gpu_hour_dws
    target_table: t_mops_gpu_day_dws
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_gpu_5min_to_hour_dws
    sql_id: task_gpu_hour_to_day_dws

  # 1.4 GPU 月汇聚: DWS -> DWS
  # 执行时间: 每月1号00:20
  - taskname: task_gpu_day_to_month_dws
    description: GPU天数据 -> 月聚合 (DWS -> DWS)
    source_tables:
      - t_mops_gpu_day_dws
    target_table: t_mops_gpu_month_dws
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_gpu_hour_to_day_dws
    sql_id: task_gpu_day_to_month_dws

  # ============================================================================
  # 2. 节点聚合链 (DWD -> DWS -> DWS -> DWS -> DWS)
  # ============================================================================

  # 2.1 节点 5分钟实时汇聚: DWD -> DWS
  # 执行时间: 6,11,16,21,26,31,36,41,46,51,56分
  - taskname: task_node_realtime_to_5min_dws
    description: 节点实时数据 -> 5分钟预聚合 (DWD -> DWS)
    source_tables:
      - t_mops_node_realtime_dwd
    target_table: t_mops_node_5min_dws
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    depends_on: []
    sql_id: task_node_realtime_to_5min_dws

  # 2.2 节点 小时汇聚: DWS -> DWS
  # 执行时间: 每小时第6分钟
  - taskname: task_node_5min_to_hour_dws
    description: 节点5分钟数据 -> 小时聚合 (DWS -> DWS)
    source_tables:
      - t_mops_node_5min_dws
    target_table: t_mops_node_hour_dws
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
      - task_node_realtime_to_5min_dws
    sql_id: task_node_5min_to_hour_dws

  # 2.3 节点 天汇聚: DWS -> DWS
  # 执行时间: 每天00:10
  - taskname: task_node_hour_to_day_dws
    description: 节点小时数据 -> 天聚合 (DWS -> DWS)
    source_tables:
      - t_mops_node_hour_dws
    target_table: t_mops_node_day_dws
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_node_5min_to_hour_dws
    sql_id: task_node_hour_to_day_dws

  # 2.4 节点 月汇聚: DWS -> DWS
  # 执行时间: 每月1号00:20
  - taskname: task_node_day_to_month_dws
    description: 节点天数据 -> 月聚合 (DWS -> DWS)
    source_tables:
      - t_mops_node_day_dws
    target_table: t_mops_node_month_dws
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_node_hour_to_day_dws
    sql_id: task_node_day_to_month_dws

  # ============================================================================
  # 3. 节点ADS表 (GPU DWS + Node DWS -> Node ADS)
  # ============================================================================

  # 3.1 节点5分钟ADS: GPU 5min DWS + Node 5min DWS -> Node 5min ADS
  - taskname: task_node_5min_ads
    description: 节点5分钟聚合ADS表(GPU+Node)
    source_tables:
      - t_mops_gpu_5min_dws
      - t_mops_node_5min_dws
    target_table: t_mops_node_5min_ads
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    depends_on:
      - task_gpu_realtime_to_5min_dws
      - task_node_realtime_to_5min_dws
    sql_id: task_node_5min_ads

  # 3.2 节点小时ADS: GPU hour DWS + Node hour DWS -> Node hour ADS
  - taskname: task_node_hour_ads
    description: 节点小时聚合ADS表(GPU+Node)
    source_tables:
      - t_mops_gpu_hour_dws
      - t_mops_node_hour_dws
    target_table: t_mops_node_hour_ads
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
      - task_gpu_5min_to_hour_dws
      - task_node_5min_to_hour_dws
    sql_id: task_node_hour_ads

  # 3.3 节点天ADS: GPU day DWS + Node day DWS -> Node day ADS
  - taskname: task_node_day_ads
    description: 节点天聚合ADS表(GPU+Node)
    source_tables:
      - t_mops_gpu_day_dws
      - t_mops_node_day_dws
    target_table: t_mops_node_day_ads
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_gpu_hour_to_day_dws
      - task_node_hour_to_day_dws
    sql_id: task_node_day_ads

  # 3.4 节点月ADS: GPU month DWS + Node month DWS -> Node month ADS
  - taskname: task_node_month_ads
    description: 节点月聚合ADS表(GPU+Node)
    source_tables:
      - t_mops_gpu_month_dws
      - t_mops_node_month_dws
    target_table: t_mops_node_month_ads
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_gpu_day_to_month_dws
      - task_node_day_to_month_dws
    sql_id: task_node_month_ads

  # ============================================================================
  # 4. 资源ADS表 (Node ADS + resource_config -> Resource ADS)
  # ============================================================================

  # 4.1 资源5分钟ADS
  - taskname: task_resource_5min_ads
    description: 资源5分钟聚合ADS表
    source_tables:
      - t_mops_node_5min_ads
      - resource_config_local
    target_table: t_mops_resource_5min_ads
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    depends_on:
      - task_node_5min_ads
    sql_id: task_resource_5min_ads

  # 4.2 资源小时ADS
  - taskname: task_resource_hour_ads
    description: 资源小时聚合ADS表
    source_tables:
      - t_mops_node_hour_ads
      - resource_config_local
    target_table: t_mops_resource_hour_ads
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
      - task_node_hour_ads
    sql_id: task_resource_hour_ads

  # 4.3 资源天ADS
  - taskname: task_resource_day_ads
    description: 资源天聚合ADS表
    source_tables:
      - t_mops_node_day_ads
      - resource_config_local
    target_table: t_mops_resource_day_ads
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_node_day_ads
    sql_id: task_resource_day_ads

  # 4.4 资源月ADS
  - taskname: task_resource_month_ads
    description: 资源月聚合ADS表
    source_tables:
      - t_mops_node_month_ads
      - resource_config_local
    target_table: t_mops_resource_month_ads
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_node_month_ads
    sql_id: task_resource_month_ads

  # ============================================================================
  # 5.1 模型实例DWS表 (DWD -> DWS -> DWS -> DWS -> DWS)
  # ============================================================================

  # 5.1.1 模型实例5分钟DWS
  - taskname: task_model_instance_5min_dws
    description: 模型实例5分钟预聚合
    source_tables:
