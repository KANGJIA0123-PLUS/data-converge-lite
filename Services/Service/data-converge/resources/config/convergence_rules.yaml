# Cron表达式格式说明:
#   ┌───────────── 分钟 (0-59)
#   │ ┌───────────── 小时 (0-23)
#   │ │ ┌───────────── 日 (1-31)
#   │ │ │ ┌───────────── 月 (1-12)
#   │ │ │ │ ┌───────────── 星期 (0-6, 0=周日)
#   │ │ │ │ │
#   * * * * *
#
#   */5 = 每5个单位
#   5,10 = 第5和第10
#   1-5 = 1到5
#
# 示例:
#   6,11,16,21,26,31,36,41,46,51,56 * * * *  每5分钟(第6秒开始)
#   6 * * * *       每小时第6分钟
#   10 0 * * *      每天00:10
#   20 0 1 * *      每月1号00:20

# ISO 8601 Duration 格式说明:
#   PT5M  = 5分钟 (5 Minutes)
#   PT1H  = 1小时 (1 Hour)
#   P1D   = 1天 (1 Day)
#   P1M   = 1月 (1 Month)
