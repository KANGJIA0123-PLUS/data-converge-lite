    source_tables:
      - t_mops_modelmetric_realtime_dwd
    target_table: t_mops__modelmetric_instance__5min_dws
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
