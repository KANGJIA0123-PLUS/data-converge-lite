    sql_id: task_model_metric_instance_5min_dws

  # 5.2.2 模型指标实小时DWS
  - taskname: task_model_metric_instance_hour_dws
    description: 模型指标实小时聚合
    source_tables:
      - t_mops__modelmetric_instance__5min_dws
    target_table: t_mops__modelmetric_instance__hour_dws
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
      - task_model_metric_instance_5min_dws
    sql_id: task_model_metric_instance_hour_dws

  # 5.2.3 模型指标实例天DWS
  - taskname: task_model_metric_instance_day_dws
    description: 模型指标实例天聚合
    source_tables:
      - t_mops__modelmetric_instance__hour_dws
    target_table: t_mops__modelmetric_instance__day_dws
    aggregation_interval: P1D
    cron: "10 0 * * *"
    depends_on:
      - task_model_metric_instance_hour_dws
    sql_id: task_model_metric_instance_day_dws

  # 5.2.4 模型指标实例月DWS
  - taskname: task_model_metric_instance_month_dws
    description: 模型指标实例月聚合
    source_tables:
      - t_mops__modelmetric_instance__day_dws
    target_table: t_mops__modelmetric_instance__month_dws
    aggregation_interval: P1M
    cron: "20 0 1 * *"
    depends_on:
      - task_model_metric_instance_day_dws
    sql_id: task_model_metric_instance_month_dws

  # ============================================================================
  # 6.1 模型指标实例ADS表
  # ============================================================================

  # 6.1.1 模型指标实例5分钟ADS
  - taskname: task_model_metric_instance_5min_ads
    description: 模型指标实例5分钟ADS表
    source_tables:
      - t_mops__modelmetric_instance__5min_dws
      - t_mops_modelinstance_5min_ads
    target_table: t_mops__modelmetric_instance__5min_ads
    aggregation_interval: PT5M
    cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    depends_on:
      - task_model_metric_instance_5min_dws
      - task_model_instance_5min_ads
    sql_id: task_model_metric_instance_5min_ads

  # 6.1.2 模型指标实小时ADS
  - taskname: task_model_metric_instance_hour_ads
    description: 模型指标实小时ADS表
    source_tables:
      - t_mops__modelmetric_instance__hour_dws
      - t_mops_modelinstance_hour_ads
    target_table: t_mops__modelmetric_instance__hour_ads
    aggregation_interval: PT1H
    cron: "6 * * * *"
    depends_on:
