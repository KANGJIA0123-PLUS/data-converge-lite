# 平台部署：60个汇聚任务。ClickHouse HTTP端点由Deployment注入。
logging:
  debug_enabled: false  # 失败SQL、参数和原因默认以ERROR记录；true额外开启调用栈和阶段调试日志。
  # 日志达到 max_bytes 时轮转并 gzip 压缩；仅在生成新压缩包时老化，
  # 按最新优先同时满足数量与总大小上限。单条超限日志仍完整保留。
  max_bytes: 10485760         # 10 MiB，轮转前原始日志大小
  backup_count: 50            # 最多保留 50 个压缩包
  max_total_bytes: 524288000  # 压缩包总大小不超过 500 MiB

clickhouse:
  host: "${CLICKHOUSE_URL}"
  port: "${CLICKHOUSE_PORT}"
  database: modelmate_metric
  username: nethouse
  password_file: /opt/its/data-converge/secret/clickhouse/password
  paas_name: clickhouse-pms-password
  kms_timeout_seconds: 30
  # 沿用公司原TLS设置；需核对httpPort实际提供HTTPS还是HTTP。
  # 如果端点实际是纯HTTP，请显式改为false，URL协议需与此一致。
  secure: true
  verify: true

startup:
  # 在业务库上执行只读SELECT 1；安装期间依赖未就绪时等待，不启动汇聚。
  timeout_seconds: 600
  initial_retry_delay_seconds: 2
  max_retry_delay_seconds: 30
  probe_timeout_seconds: 10

state:
  directory: /srv/its/MindOpsBOSE/data-converge/data/lite-state
  archives:
    enabled: true         # 正常服务后台每天生成一份一致性压缩备份；不删除活动账本记录。
    retention_days: 30    # 从原快照时间计龄，压缩和重启不重置期限。

# 主备必须使用同一份完整持久账本及同一个锁文件，不支持独立hostPath自动接管。
# 复用下方Redis认证配置，但使用独立连接；账本身份校验已临时移除，见docs/known-issues.md。
leadership:
  enabled: true
  cluster_name: data-converge-modelmate-metric  # 同一业务部署的所有副本必须一致。
  ttl_seconds: 30
  renew_interval_seconds: 5
  standby_poll_seconds: 2

# 本次默认启用DWD就绪门控；5类信号必须全部到齐，超时不会放行半窗。
# 公司参考使用 Sentinel + PSM 挑战认证；连接信息从 XMS 解密后的 PMS 获取。
dwd_ready:
  enabled: true
  queue_key: modelverse:dwd:ready
  block_seconds: 1
  batch_size: 100
  wait_warning_seconds: 120
  redis:
    mode: sentinel
    service_name: redis-cluster  # Sentinel 主节点组名，不是原生 Redis Cluster。
    db: 5
    username: admin        # 可改为其他 PMS 账号；省略时默认 admin，不作为 AUTH 用户名。
    # 约定挂载路径：需将 kube-system/its-redis-pwd-secret 的 password 键挂到此文件。
    # 原 Deployment 尚无该挂载；gde-adapter-certfiles 只有证书，不能代替 Redis 密码。
    password_file: /opt/its/data-converge/secret/redis/password
    # 若 PMS 内有多个 Redis 服务，填写其准确 name；未填写时要求唯一匹配账号。
    paas_name: null
    kms_timeout_seconds: 30
    # 以下两条路径已由上传的 apiVersion.txt 确认。
    root_key_file: /opt/its/secret/its-common-secret/redis_root.key
    work_key_file: /opt/its/secret/its-common-secret/redis_shared.key
    ssl: false             # 按上传参考的非 TLS 连接；现场启用 TLS 时改为 true。
    ssl_verify: true
    socket_timeout: 3
    socket_connect_timeout: 2

scheduler:
  # 调度时区跟随容器 TZ 或系统时区配置，启动后固定；不单独设置业务时区。
  # 单条任务（清理+汇聚）超时，按周期设置，单位秒。取值范围：
  #   5min 10-300，hour 10-1800，day 10-3600，month 10-3600
  task_timeout_seconds:
    5min: 120
    hour: 600
    day: 1800
    month: 1800
  max_concurrent_tasks: 4       # 全局同时执行的任务实例上限
  task_parallelism: 1           # 同一任务同时执行的不同批次数，取值 1-3
  poll_interval_seconds: 5
  catchup_limit: 100            # 每轮最多新派发的实例数
  max_attempts: 3               # 全局重试：总尝试次数（保持现状）
  retry_delay_seconds: 30       # 全局重试间隔（保持现状）
  # 跨周期上游（小时等5分钟、天等小时、月等天）软等待：到 Cron 时间后最多再等待的秒数，
  # 上游提前齐全立即执行，超时按已有数据汇聚并告警；0 表示不等待。
  cross_period_wait_enabled: true
  cross_period_wait_seconds:
    hour: 300
    day: 300
    month: 300
  # 任务名到非负整数秒数的覆盖；未列出的任务按其周期取值。
  cross_period_wait_overrides: {}
  # 跳批次：长时间停机后，落后批次数超过阈值时跳到当前批次。
  #   current_only        只执行当前批次，跳过的历史窗口记录日志并给出补算命令
  #   current_then_resume 先执行当前批次，再在后台按顺序补跑跳过的历史窗口
  # 超过 skip_max_resume_days 天的历史不补跑，仅记录。
  skip_batches: false
  skip_mode: current_only
  skip_threshold_batches:
    5min: 12
    hour: 3
    day: 2
    month: 2
  skip_max_resume_days: 31

config:
  convergence_rules_path: resources/config/convergence_rules.yaml
  sql_directory: resources/sql
