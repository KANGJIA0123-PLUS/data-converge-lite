#卷逻辑名称;挂载路径;只读属性;挂载卷源类型;挂载卷源;挂载item列表(secret时可选，多个item使用逗号分隔)
#ClickHouse凭据卷（来自外部 datacube-clickhouse-secret，由 datacube 平台预置；secret 内 password 键即 KMS 密文，挂载后落地为 password 文件）
#挂载=本阶段交付；Python 侧读取 /opt/its/@SERVICE_NAME@/secret/clickhouse/password 为后续阶段
{{.Chart.Name}}-clickhouse;/opt/its/@SERVICE_NAME@/secret/clickhouse/;true;secret;datacube-clickhouse-secret
#Redis凭据卷（当前部署位于 kube-system；password 键为 XMS 密文，Python 读取 secret/redis/password）
{{.Chart.Name}}-redis-password;/opt/its/@SERVICE_NAME@/secret/redis/;true;secret;its-redis-pwd-secret;password
