#=========公共配置=========
#服务名称
SERVICE_NAME=@SERVICE_NAME@
#服务端口
SERVICE_PORT=@SERVICE_PORT@
#日志路径
LOG_PATH=@LOG_PATH@
#审计日志路径
AUDIT_PATH=@AUDIT_PATH@
#业务用户
USER=@SERVICE_USER@
#业务组
GROUP=@SERVICE_GROUP@

USE_PYTHON=true

LOAD_SITE_PACKAGES=true
#=========依赖配置=========
#环境变量依赖（多个以逗号分隔）
ENV_DEPENDENCY=XMS_WORKSPACE_DIR
FILE_DEPENDENCY=/var/log,/opt/its
