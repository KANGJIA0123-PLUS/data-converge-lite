#-----------服务基础配置-----------
#服务名称，不能使用下划线及其他特殊符号，长度不得大于31，全小写
SERVICE_NAME=data-converge

PACKAGE_TYPE=docker
SERVICE_PORT=25642
CHART_NAME=${SERVICE_NAME}-${VERSION}.tgz

#---JAVA构建参数(默认包含docker构建)---
#POM路径
POM_PATH=${REPOSITORY_PATH}/Services/Service/pom.xml
#JAVA构建命令
JAVA_BUILD_CMD=mvn -B -s ${MAVEN_SETTING_PATH} clean install

#审计日志路径,新框架仅gde-adapter服务适配
AUDIT_PATH=/var/paas/sys/log/its/
#临时文件路径
TEMP_PATH=/srv/its/${PRODUCT_NAME}/${SERVICE_NAME}/temp
#数据路径
DATA_PATH=/srv/its/${PRODUCT_NAME}/${SERVICE_NAME}/data
#TODO 适配日志配置后修改
LOG_PATH=/srv/its/${PRODUCT_NAME}/${SERVICE_NAME}/log
PYTHON_COPY_CMD=pip3 download pip==26.2 --trusted-host cmc.centralrepo.rnd.huawei.com -i https://cmc.centralrepo.rnd.huawei.com/artifactory/pypi-central-repo/simple/ -d ${REPOSITORY_PATH}/Services/Package/images/bin/
