# Strategic merge patch example; this file is not applied automatically.
# Replace the Deployment/container name and the fixed node hostname before use.
# Keep the existing run-data mount. State lives beneath it at
# /srv/its/MindOpsBOSE/data-converge/data/lite-state. hostPath persists only on
# the selected node: moving nodes requires migrating the ledger while stopped
# or changing to storage shared across nodes. A missing ledger is not auto-created.
# Preinstall Python packages and the matching company SDK in the image when
# /opt/its/data-converge is read-only; probes never unpack dependency archives.
# Replace the DWD ConfigMap/Secret references with the actual producer's Redis
# endpoint/authentication sources. These resource names are placeholders.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-converge
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      terminationGracePeriodSeconds: 360
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_FIXED_STATE_NODE
      containers:
        - name: data-converge
          command: ["/bin/bash", "/opt/its/data-converge/bin/start.sh"]
          env:
            - name: APP_CONF_FILE
              value: /opt/its/data-converge/lib/data-converge/resources/config/app_config.yaml
            - name: DWD_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: REPLACE_WITH_DWD_REDIS_CONFIGMAP
                  key: host
            - name: DWD_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: REPLACE_WITH_DWD_REDIS_CONFIGMAP
                  key: port
            - name: DWD_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_DWD_REDIS_SECRET
                  key: password
          startupProbe:
            exec:
              command: ["/bin/bash", "/opt/its/data-converge/bin/liveness_check.sh"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/bin/bash", "/opt/its/data-converge/bin/liveness_check.sh"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/bash", "/opt/its/data-converge/bin/readiness_check.sh"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash", "/opt/its/data-converge/bin/pre-stop.sh"]
