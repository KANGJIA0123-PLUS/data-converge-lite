name: test-baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML==6.0.2 redis==5.2.1 APScheduler==3.11.0 Flask==3.1.3 fakeredis lupa
      - name: Enforce failure baseline
        run: python tools/test_baseline_gate.py
