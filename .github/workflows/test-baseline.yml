name: test-baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-baseline:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==9.2.0 PyYAML==6.0.2 redis==5.2.1 APScheduler==3.11.0 Flask==3.1.3 fakeredis==2.40.0 lupa==2.8
      - name: Enforce failure baseline
        run: python tools/test_baseline_gate.py
